schema: spec-driven

context: |
  Product: sdlc-pipeline, a Claude Code plugin. It takes a business use case and turns it into
  reviewed, tested, archived code. A team of agents (architect, spec-reviewer, junior-dev, qa,
  senior-dev) does the work, and a human approves at two gates. OpenSpec owns the workflow
  mechanics; the agents own judgment and standards. It is for teams that want spec-driven delivery
  with an audit trail: every run leaves a retrospective and a session report.

  What the repo is made of. There is no application code; the "code" is prompts plus a little
  Python:
  - agents/<name>.md: subagent definitions (frontmatter: name, description, model, tools).
  - skills/<name>/SKILL.md: skills (init, write-domain, write-standards, write-use-case,
    build-use-case, session-report).
  - hooks/hooks.json + hooks/log-event.py: event logging to the host project's
    logs/pipeline-events.jsonl.
  - scripts/: validate.py (CI static checks), pipeline-report.py (HTML dashboard).
  - templates/: files copied into host projects (profile, use case, retrospective,
    retrospectives README). templates/standards/ is the standards catalogue: architecture/*.md
    (pick at most one) and concerns/*.md (pick any), each rule a numbered §n with Why, Check and
    Profile lines and <angle-bracket> stack blanks.
  - docs/: user documentation. README.md is the entry point; docs/getting-started.md gives the
    setup order for a host project (PRD via grill-me, init, write-domain, write-standards, then
    openspec/config.yaml and README).
  - .claude-plugin/plugin.json and marketplace.json: manifests. Their versions must match.

  Hard constraints:
  - Stack-agnostic. Agents, skills and catalogue templates never name a language, build tool or
    framework (validate.py checks the templates). Stack facts belong in the host project's
    .claude/sdlc-profile.md and standards/, which the agents read.
  - Don't restate OpenSpec. Agents invoke the opsx:* skills for their phase and add only
    judgment; they don't copy OpenSpec's procedure or artifact formats.
  - Python is 3.8+ and standard library only. No pip dependencies.
  - The plugin never writes to project-owned files on update (the profile, use cases,
    retrospectives, domain/ and standards/).
  - Plugins can't set env vars or permissions. Anything like that is documented for the
    project's settings.json, not shipped.

  Domain terms: PRD (the host project's product requirements, written with grill-me), use case
  (UC-n, in use-cases/), profile (.claude/sdlc-profile.md), domain docs (domain/: overview,
  actors-and-personas, glossary, bounded-contexts, business-rules with BR-<AREA>-<n> ids),
  standards (standards/<file>.md, rules numbered §n and cited from the profile), standards
  catalogue (templates/standards/), change (an OpenSpec change), Gate 1 (plan approval) and Gate 2 (finished-change approval), fix loop,
  budget guardrails, retrospective, session report, host project (the repo the plugin runs in, as
  opposed to this repo).

  Verification: python3 scripts/validate.py and claude plugin validate . (both run in CI). There
  is no unit test suite. Behaviour changes are checked by running the pipeline in a host project
  with claude --plugin-dir <this repo>, and judged with docs/evaluating-the-pipeline.md.

  Conventions: conventional commits (feat:, fix:, docs:, chore:). Semver, with the version bumped
  in both manifests plus a CHANGELOG.md entry. Before 1.0, a change host projects must make to
  their profile is a minor bump. Prose is plain English: short sentences, active voice, no
  filler.

rules:
  proposal:
    - Say which components change (agents, skills, hooks, scripts, templates, docs, manifests) and whether host projects must do anything (edit the profile, settings.json, re-run init).
    - State the semver bump and why.
  design:
    - For a prompt change to an agent or skill, quote the current wording and the replacement, and say what failure (from a retrospective or session report, if there is one) it fixes.
    - Explain how the change stays stack-agnostic and leaves OpenSpec's mechanics to OpenSpec.
  specs:
    - Write requirements as observable behaviour of the plugin in a host project (what an agent does, what a file contains, what a gate shows), not as prompt wording.
  tasks:
    - Include updating the affected docs (README.md, docs/*.md) and CHANGELOG.md.
    - Include bumping the version in plugin.json and marketplace.json when the change ships.
    - End with running python3 scripts/validate.py and claude plugin validate .; for a behaviour change, add a manual run in a host project with --plugin-dir and say what to check.
